services:
  chronicle-pdf:
    build:
      context: ../..
      dockerfile: docker/embedded/Dockerfile
    container_name: Chronicle-PDF
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - "8080:8080"
    volumes:
      - ../../chronicle/latest/data:/usr/share/tessdata:rw
      - ../../chronicle/latest/config:/configs:rw
      - ../../chronicle/latest/logs:/logs:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "true"
      SECURITY_ENABLELOGIN: "false"
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: Chronicle PDF
      UI_HOMEDESCRIPTION: Demo site for Chronicle PDF Latest
      UI_APPNAMENAVBAR: Chronicle PDF Latest
      SYSTEM_MAXFILESIZE: "100"
      METRICS_ENABLED: "true"
      SYSTEM_GOOGLEVISIBILITY: "true"
      SHOW_SURVEY: "true"
    networks:
      - chronicle-network

networks:
  chronicle-network:
    driver: bridge

volumes:
  chronicle-data:
  chronicle-config:
  chronicle-logs:
